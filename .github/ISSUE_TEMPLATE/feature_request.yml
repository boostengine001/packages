name: Feature request
description: Suggest an idea for @boostengine/ui
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to build that the package does not support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Component API sketch, prop names, or behaviour description.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have searched existing issues for duplicates
          required: true
