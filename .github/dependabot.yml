# Dependabot: weekly dependency updates for every boost-* package.
# Major bumps open separately for review; minor+patch are grouped per package.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/boost-analytics"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: npm
    directory: "/boost-auth"
    schedule:
      interval: weekly
