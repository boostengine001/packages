name: boost-ui CI

on:
  push:
    branches: [main]
    paths: ['boost-ui/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['boost-ui/**', '.github/workflows/ci.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: boost-ui

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: boost-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit -- --coverage

      - name: Build
        run: npm run build

      - name: Smoke tests (build artifacts)
        run: npm run test:smoke

      - name: Package exports (publint)
        run: npm run publint

      - name: Size budget (size-limit)
        run: npm run size

  visual:
    name: Visual (Chromium, 7 presets)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: boost-ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: boost-ui

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: boost-ui

      - name: Build showcase bundle
        run: npm run build:showcase
        working-directory: boost-ui

      - name: Visual tests (real browser)
        run: npm run test:visual
        working-directory: boost-ui

      - name: Upload screenshots (visual diffs on failure)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-screenshots
          path: |
            boost-ui/test-results/visual/
            boost-ui/visual/showcase.spec.ts-snapshots/
          retention-days: 7
