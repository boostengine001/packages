name: boost-ui CI

on:
  push:
    branches: [main]
    paths: ['boost-ui/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['boost-ui/**', '.github/workflows/ci.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: boost-ui

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: boost-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Smoke tests (build artifacts)
        run: npm run test:smoke

      - name: Package exports (publint)
        run: npm run publint

      - name: Size budget (size-limit)
        run: npm run size
