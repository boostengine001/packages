name: boost-ui docs

# Deploys the Ladle component playground to GitHub Pages.
# One-time setup (repo admin): Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". After that every push to main deploys it.
on:
  push:
    branches: [main]
    paths:
      - 'boost-ui/stories/**'
      - 'boost-ui/src/**'
      - 'boost-ui/.ladle/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: boost-ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: boost-ui/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build playground
        run: npm run docs:build:pages
        env:
          PAGES_BASE: /packages/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: boost-ui/docs-playground

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
